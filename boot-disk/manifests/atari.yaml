# Paths support shell-style environment expansion (${VAR}) and ~.
# Relative paths are resolved from the nio-core-apps repository root.

# The Atari boot disk carries exactly one program. PicoBoot runs the first file in the
# directory and nothing else, there is no DOS to run the others from, and once the
# configured image is booted the boot disk is no longer reachable. The other F* tools
# are still built (build/atari/bin) but are not put on this disk.
#
# dir2atr sorts the directory by name, so the program is staged as autorun.xex. ftestnio
# is the hardware bring-up screen; swap the src below for another program (a config
# application, later) to change what the disk boots.
apps:
  - src: ${BOOT_DISK_BIN}/ftestnio.xex
    name: autorun.xex
