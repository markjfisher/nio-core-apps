# Paths support shell-style environment expansion (${VAR}) and ~.
# Relative paths are resolved from the nio-core-apps repository root.

# PicoBoot runs the first file in the disk directory, and dir2atr sorts the directory
# by name, so the program that should start at boot is staged as autorun.xex (it sorts
# before every F* tool). ftestnio is the hardware bring-up screen; swap the src below
# for another program to change what the disk boots.
apps:
  - src: ${BOOT_DISK_BIN}/ftestnio.xex
    name: autorun.xex
  - src: ${BOOT_DISK_BIN}/fhost.xex
    name: fhost.xex
  - src: ${BOOT_DISK_BIN}/fls.xex
    name: fls.xex
  - src: ${BOOT_DISK_BIN}/fin.xex
    name: fin.xex
  - src: ${BOOT_DISK_BIN}/fmount.xex
    name: fmount.xex
  - src: ${BOOT_DISK_BIN}/fdrive.xex
    name: fdrive.xex
  - src: ${BOOT_DISK_BIN}/fapp.xex
    name: fapp.xex
  - src: ${BOOT_DISK_BIN}/fnaccept.xex
    name: fnaccept.xex
