# PicoBoot runs the first directory entry. The selector probes for two
# 130XE-compatible banks, then uses PicoBoot to load the appropriate XEX.
# Build both first in repos/nio-config: make TARGET=atari && make atari-banked.
# The workspace environment exports NIO_CONFIG and NIO_CONFIG_ATARI_BIN.
apps:
  - src: ${NIO_CONFIG}/build/atari-banked/bin/loader.xex
    name: autorun.xex
  - src: ${NIO_CONFIG}/build/atari-banked/bin/config-nio.xex
    name: banked.xex
  - src: ${NIO_CONFIG_ATARI_BIN}/config-nio.xex
    name: standard.xex
