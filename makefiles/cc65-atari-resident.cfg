FEATURES {
    STARTADDRESS: default = $1D00;
}
SYMBOLS {
    __STACKSIZE__:       type = weak,   value = $0800;
    __STARTADDRESS__:    type = export, value = %S;
    __RESERVED_MEMORY__: type = weak,   value = $0000;
    # cc65 prepends one underscore to C names.  Export C-visible aliases for
    # linker-produced BSS boundaries so the installer can reserve the whole
    # linked image, not just its code segment.
    ___BSS_LOAD__:      type = export, value = __BSS_LOAD__;
    ___BSS_SIZE__:      type = export, value = __BSS_SIZE__;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
MEMORY {
    ZP:   file = "", define = yes, start = $0082, size = $007E;
    MAIN: file = %O, define = yes, start = %S,
          size = $BC20 - __STACKSIZE__ - __RESERVED_MEMORY__ - %S;
}
FILES {
    %O: format = atari;
}
FORMATS {
    atari: runad = start;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    EXTZP:    load = ZP,   type = zp,                optional = yes;
    STARTUP:  load = MAIN, type = ro,  define = yes;
    LOWBSS:   load = MAIN, type = rw,                optional = yes;
    LOWCODE:  load = MAIN, type = ro,  define = yes, optional = yes;
    ONCE:     load = MAIN, type = ro,  define = yes, optional = yes;
    CODE:     load = MAIN, type = ro,  define = yes;
    RODATA:   load = MAIN, type = ro,  define = yes;
    DATA:     load = MAIN, type = rw,  define = yes;
    INIT:     load = MAIN, type = bss, define = yes, optional = yes;
    BSS:      load = MAIN, type = bss, define = yes;
}
