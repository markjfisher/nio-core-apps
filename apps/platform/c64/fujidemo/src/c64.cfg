# ld65 layout for the FujiNet demo: one PRG from $0801 to $37ff
# (program, then sprites at $3400); variables live at $c000.
MEMORY {
    ZP:       file = "", start = $0002, size = $008e;
    LOADADDR: file = %O, start = $07ff, size = $0002;
    MAIN:     file = %O, start = $0801, size = $2bff, fill = yes;
    SPR:      file = %O, start = $3400, size = $0400;
    VARS:     file = "", start = $c000, size = $1000;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    STARTUP:  load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = rw;
    RODATA:   load = MAIN,     type = ro;
    SPRITES:  load = SPR,      type = ro;
    BSS:      load = VARS,     type = bss, define = yes;
}
